{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto py-16 px-4 max-w-lg text-center">
    <div class="bg-white shadow rounded-2xl p-10">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Payment Successful!</h1>
        <p class="text-gray-500 mb-4">Your order has been confirmed. Thank you for shopping with us!</p>

        <div class="bg-gray-50 rounded-xl p-4 mb-6 text-left space-y-2 text-sm">
            <div class="flex justify-between">
                <span class="text-gray-500">Order Number</span>
                <span class="font-semibold">{{ order.order_number }}</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">Total Paid</span>
                <span class="font-semibold text-green-600">₹{{ order.total }}</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">Status</span>
                <span class="font-semibold capitalize">{{ order.get_status_display }}</span>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
            <a href="{% url 'orders:order_detail' order.order_number %}"
               class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition text-center">
                View Order Details
            </a>
            <a href="{% url 'catalog:product_list' %}"
               class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 py-3 rounded-lg font-semibold transition text-center">
                Continue Shopping
            </a>
        </div>
    </div>
</div>
{% endblock %}
